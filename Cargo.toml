[package]
name = "rabbitmqadmin-sdk"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Async Rust SDK for the RabbitMQ Management HTTP API"
repository = "https://github.com/assafvayner/rabbitmqadmin-sdk"
documentation = "https://docs.rs/rabbitmqadmin-sdk"
readme = "README.md"
keywords = ["rabbitmq", "amqp", "message-queue", "admin", "management"]
categories = ["api-bindings", "network-programming"]
rust-version = "1.85"
exclude = ["/.github", "/docs"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
wiremock = "0.6"
